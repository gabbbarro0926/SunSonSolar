<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sun Son Solar | Registration</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons (icon font only, not the framework) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="registration-page">
    <section class="registration-card">
      
      <!-- Logo -->
      <div class="logo">
        <img src="assets/images/logo.png" alt="Sun Son Solar" class="logo-mark">
      </div>

      <!-- Title -->
      <h1 class="form-title">Create your account</h1>

      <!-- Role tabs -->
      <div class="role-tabs">
        <button type="button" class="role-tab active" data-role="customer">Customer</button>
        <button type="button" class="role-tab" data-role="employee">Employee</button>
      </div>

      <form class="registration-form" action="register.php" method="POST" novalidate>

        <input type="hidden" name="user_type" id="user-type" value="customer">

        <!-- Name -->
        <div class="field">
          <label class="field-label">Name:</label>
          <div class="form-row">
            <div class="field">
              <input type="text" class="form-input" id="first-name" name="first_name" placeholder="First Name" required>
              <div class="error-message"></div>
            </div>
            <div class="field">
              <input type="text" class="form-input" id="middle-name" name="middle_name" placeholder="Middle Name">
              <div class="error-message"></div>
            </div>
            <div class="field">
              <input type="text" class="form-input" id="last-name" name="last_name" placeholder="Last Name" required>
              <div class="error-message"></div>
            </div>
          </div>
        </div>

        <!-- Birthday & Gender -->
        <div class="form-row">
          <div class="field">
            <label class="field-label">Birthday:</label>
            <input type="date" class="form-input" id="birth-date" name="birth_date" required>
            <div class="error-message"></div>
          </div>
          <div class="field">
            <label class="field-label">Gender:</label>
            <select class="form-select" id="gender" name="gender" required>
              <option value="" disabled selected>Select your gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="others">Others</option>
            </select>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Email & Contact -->
        <div class="form-row">
          <div class="field">
            <label class="field-label">Email:</label>
            <input type="email" class="form-input" id="email" name="email" placeholder="Email" required>
            <div class="error-message"></div>
          </div>
          <div class="field">
            <label class="field-label">Contact Number:</label>
            <input type="tel" class="form-input" id="phone" name="phone_no" placeholder="Mobile Number" inputmode="numeric" required>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Address -->
        <div class="field">
          <label class="field-label">Address:</label>
          <textarea class="form-input" id="address" name="address" rows="3" required></textarea>
          <div class="error-message"></div>
        </div>

        <!-- Department (employee only) -->
        <div id="employee-fields" class="hidden">
          <div class="field">
            <label class="field-label">Department:</label>
            <select class="form-select" id="department" name="department">
                <option value="" disabled selected>Select department</option>
                <option value="Administration">Administration</option>
                <option value="IT">IT</option>
                <option value="Dispatch">Dispatch</option>
                <option value="Accounting">Accounting</option>
                <option value="HR">HR</option>
                <option value="Marketing">Marketing</option>
                <option value="Sales">Sales</option>
                <option value="Customer Service">Customer Service</option>
            </select>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Username -->
        <div class="field">
          <label class="field-label">Username:</label>
          <input type="text" class="form-input" id="username" name="username" required>
          <div class="error-message"></div>
        </div>

        <!-- Password -->
        <div class="field">
          <label class="field-label">Password:</label>
          <div class="password-wrapper">
            <input type="password" class="form-input" id="password" name="password" required>
            <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="error-message"></div>
        </div>

        <!-- Confirm Password -->
        <div class="field">
          <label class="field-label">Confirm Password:</label>
          <div class="password-wrapper">
            <input type="password" class="form-input" id="confirm-password" name="confirm_password" required>
            <button type="button" class="password-toggle" data-target="confirm-password" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="error-message"></div>
        </div>

        <!-- Terms -->
        <div class="checkbox-field">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">I Agree to <a href="#">Terms and Conditions</a></label>
          <div class="error-message"></div>
        </div>

        <!-- Submit -->
        <button type="submit" class="signup-btn">Sign-Up</button>

        <!-- Login link -->
        <p class="login-prompt">
        Already have an account? <u><a href="login.html">Log-in</a></u>
        </p>

      </form>
    </section>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
