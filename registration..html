<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sun Son Solar | Registration</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="registration-page">
    <section class="registration-card">

      <!-- Loading spinner overlay -->
    <div id="loading-overlay" class="loading-overlay d-none">
      <div class="spinner-border text-success" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

      <!-- Logo -->
      <div class="logo text-center">
        <img src="assets/images/logo.png" alt="Sun Son Solar" class="logo-mark">
      </div>

      <!-- Title -->
      <h1 class="form-title">Create your account</h1>

      <!-- Role tabs -->
      <div class="role-tabs">
        <button type="button" class="role-tab active" data-role="customer">Customer</button>
        <button type="button" class="role-tab" data-role="employee">Employee</button>
      </div>

      <form class="registration-form" action="register.php" method="POST" novalidate>

        <!-- Hidden field for user_type -->
        <input type="hidden" name="user_type" id="user-type" value="customer">

        <!-- Name -->
        <div class="mb-3">
          <label class="form-label">Name:</label>
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <input type="text" class="form-control" id="first-name" name="first_name" placeholder="First Name" required>
              <div class="error-message"></div>
            </div>
            <div class="col-12 col-md-4">
              <input type="text" class="form-control" id="middle-name" name="middle_name" placeholder="Middle Name">
              <div class="error-message"></div>
            </div>
            <div class="col-12 col-md-4">
              <input type="text" class="form-control" id="last-name" name="last_name" placeholder="Last Name" required>
              <div class="error-message"></div>
            </div>
          </div>
        </div>

        <!-- Birthday & Gender -->
        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Birthday:</label>
            <input type="date" class="form-control" id="birth-date" name="birth_date" required>
            <div class="error-message"></div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Gender:</label>
            <select class="form-select" id="gender" name="gender" required>
              <option value="" disabled selected>Select your gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="others">Others</option>
            </select>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Email & Contact -->
        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
            <div class="error-message"></div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Contact Number:</label>
            <input type="tel" class="form-control" id="phone" name="phone_no" placeholder="Mobile Number" inputmode="numeric" required>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Address -->
        <div class="mb-3">
          <label class="form-label">Address:</label>
          <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
          <div class="error-message"></div>
        </div>

        <!-- Department (employee only) -->
        <div id="employee-fields" class="d-none">
          <div class="mb-3">
            <label class="form-label">Department:</label>
            <input type="text" class="form-control" id="department" name="department" maxlength="50">
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Username -->
        <div class="mb-3">
          <label class="form-label">Username:</label>
          <input type="text" class="form-control" id="username" name="username" required>
          <div class="error-message"></div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label">Password:</label>
          <input type="password" class="form-control" id="password" name="password" required>
          <div class="error-message"></div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
          <label class="form-label">Confirm Password:</label>
          <input type="password" class="form-control" id="confirm-password" name="confirm_password" required>
          <div class="error-message"></div>
        </div>

        <!-- Terms -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
          <label class="form-check-label" for="terms">
            I Agree to <a href="#">Terms and Conditions</a>
          </label>
          <div class="error-message"></div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn signup-btn w-100">Sign-Up</button>

      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
